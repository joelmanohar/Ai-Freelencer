server:
  port: ${PORT:8080}

spring:
  application:
    name: freelancehub-backend

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/freelancer_marketplace}
      auto-index-creation: true

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: none

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  notifications:
    admin-email: ${ADMIN_NOTIFICATION_EMAIL:}
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-me-before-deploy}
    expiration-ms: 604800000 # 7 days
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    currency: INR

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
